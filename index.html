const creditzMult = () => G.cmLevel ? SHOP.creditz.vals[G.cmLevel - 1] : 1;
const miningSpeed = () => G.spLevel ? SHOP.speed.vals[G.spLevel - 1] : BASE_SPEED;
const rebirthsDone = () => G.rebirths - 1;
const perk = n => rebirthsDone() >= n;
const rebirthCost = () => { const i = G.rebirths - 1; return i < REBIRTH_COSTS.length ? REBIRTH_COSTS[i] : REBIRTH_COSTS[REBIRTH_COSTS.length - 1] * Math.pow(4, i - REBIRTH_COSTS.length + 1); };
const bombCooldown = () => perk(8) ? 3 : perk(1) ? 4 : 5;
const drillCount = () => G.autoLevel + (perk(4) ? 1 : 0);
const canLoad = () => G.loading <= 0;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const bestValue = b => Math.max(...b.minerals.map(m => m[1]));
const totalMult = () => G.rebirthMult * creditzMult() * BIOMES[G.biome].bonus;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeBack = t => { t = clamp(t, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function fmt(n) {
  n = Math.floor(n);
  if (n < 1e12) return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const u = ['T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  let i = Math.floor(Math.log10(n) / 3) - 4;
  if (i >= u.length) return n.toExponential(2);
  return (n / Math.pow(10, (i + 4) * 3)).toFixed(2) + ' ' + u[i];
}

// ---------------- saving (localStorage: a small storage box the browser keeps for this page) ----------------
const SAVE_KEY = 'justmine.save.v1';   // same key as version 1, so old saves just keep working
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 2, creditz: G.creditz, high: G.high, cm: G.cmLevel, sp: G.spLevel, bomb: G.bombLevel, auto: G.autoLevel,
      rebirths: G.rebirths, rmult: G.rebirthMult, biome: G.biome, hue: G.crystalHue,
      found: G.found, ach: G.ach, visited: G.visited, stats: G.stats, heartHP: G.heartHP, won: G.won, settings: G.settings,
    }));
  } catch (e) {}
}
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!s) return false;
    G.creditz = +s.creditz || 0; G.high = +s.high || 0; G.shown = G.creditz;
    G.cmLevel = clamp(s.cm | 0, 0, 7); G.spLevel = clamp(s.sp | 0, 0, 5); G.bombLevel = clamp(s.bomb | 0, 0, 5); G.autoLevel = clamp(s.auto | 0, 0, 5);
    G.rebirths = Math.max(1, s.rebirths | 0); G.rebirthMult = +s.rmult || 1;
    G.biome = clamp(s.biome | 0, 0, BIOMES.length - 1); G.crystalHue = +s.hue || 0;
    // version 2 extras (missing in old saves -> defaults)
    G.found = s.found && typeof s.found === 'object' ? s.found : {};
    G.ach = s.ach && typeof s.ach === 'object' ? s.ach : {};
    G.visited = (s.visited | 0) || (1 | (1 << G.biome));
    G.stats = Object.assign({ rocks: 0, empty: 0, minerals: 0, time: 0, bombs: 0 }, s.stats || {});
    G.heartHP = s.heartHP > 0 ? s.heartHP : HEART_HP; G.won = !!s.won;
    if (s.settings) G.settings = Object.assign({ vol: 0, music: true }, s.settings);
    return true;
  } catch (e) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function wipeSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

// ---------------- colours ----------------
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const x = hexRgb(a), y = hexRgb(b); return rgbHex(x[0] + (y[0] - x[0]) * t, x[1] + (y[1] - x[1]) * t, x[2] + (y[2] - x[2]) * t); }
const lighten = (c, t) => mix(c, '#ffffff', t), darken = (c, t) => mix(c, '#000000', t);
function hueShift(hex, deg) {
  let [r, g, b] = hexRgb(hex).map(v => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (mx !== mn) {
    const d = mx - mn; s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6;
  }
  h = (h + deg / 360 + 10) % 1;
  const f = (p, q, t) => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  if (s === 0) return rgbHex(l * 255, l * 255, l * 255);
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  return rgbHex(f(p, q, h + 1 / 3) * 255, f(p, q, h) * 255, f(p, q, h - 1 / 3) * 255);
}
const rgba = (hex, a) => { const c = hexRgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; };

// ---------------- biome loading + his rock generator ----------------
function loadBiome(i, fromTeleport) {
  G.biome = i;
  G.visited |= (1 << i);
  G.rocks = []; G.meteors = [];
  G.drills.forEach(d => { d.target = null; });
  G.menu = null; G.regenWait = -1;
  if (fromTeleport) { G.loading = 30; G.tp = 0; G.tpName = BIOMES[i].name; G.amb = []; AUDIO.setSong(i); }
  G.heart = null;
  if (i === BIOMES.length - 1 && rebirthsDone() >= HEART_REBIRTHS && !G.won) G.heart = { hp: G.heartHP, cool: 0, shake: 0, flash: 0 };
  makeGrid();
}
function makeGrid() {
  const q = [];
  for (let c = 0; c < 9; c++) {
    for (let r = 0; r < 5; r++) {
      if (G.heart && c >= 3 && c <= 5 && r >= 1 && r <= 3) continue;   // room for the Heart
      q.push({ c, r });
    }
    q.push(null);
  }
  G.gen = q;
}
function spawnRock(c, r) {
  const b = BIOMES[G.biome];
  let dir = 180;
  for (let k = 0; k < 4; k++) if (rnd(1, 2) === 2) dir += 90;
  const rock = { x: -192 + 48 * c, y: 128 - 48 * r, dir, costume: 0, bright: 0, hue: 0, seed: Math.random() * 1000,
    spawnT: 2, cool: 0, coolMax: 1, state: 'rock', gem: -1, gemT: 0, value: 0, shake: 0, flash: 0, born: G.time, golden: false };
  if (b.bright) rock.bright = rnd(b.bright[0], b.bright[1]);
  if (b.magnet && rnd(1, 2) === 2) rock.hue = 125;
  if (b.rainbow) { rock.hue = G.crystalHue; G.crystalHue = (G.crystalHue + 5) % 200; }
  if (rnd(1, perk(3) ? 125 : 250) === 1) rock.golden = true;
  recolor(rock);
  G.rocks.push(rock);
}
function recolor(rock) {
  const art = ART.rocks[BIOMES[G.biome].name][rock.costume];
  let c = art.fill;
  if (rock.hue) c = hueShift(c, rock.hue * 1.8);                         // Scratch colour effect: 200 = full circle
  const v = rock.bright * 2.55, rgb = hexRgb(c);                         // Scratch brightness adds light
  c = rgbHex(rgb[0] + v, rgb[1] + v, rgb[2] + v);
  const l = hexRgb(c).reduce((a, x) => a + x, 0) / 3;
  if (l < 40) c = mix(c, '#4a4650', 0.45);                               // keep near-black rocks readable
  rock.col = rock.golden ? '#e8ae1c' : c;
}
const aliveRocks = () => G.rocks.filter(r => r.state === 'rock').length;

// ---------------- mining ----------------
function rollMineral(b) {
  for (let i = 0; i < b.minerals.length; i++) { const n = b.minerals[i][0]; if (rnd(1, n) === n) return i; }
  return -1;
}
function addFound(key, i) {
  const arr = G.found[key] || (G.found[key] = []);
  const first = !arr[i];
  arr[i] = (arr[i] || 0) + 1;
  return first;
}
function giveCreditz(n) { G.creditz += n; if (G.creditz > G.high) G.high = G.creditz; }
function breakRock(rock, special) {
  const b = BIOMES[G.biome];
  G.stats.rocks++;
  chunks(rock.x, rock.y, rock.col, 10);
  dust(rock.x, rock.y, rock.col, 6);
  G.shake = Math.max(G.shake, 2);
  let gemKey = b.name, i, gain, rar;
  if (rock.golden) { gemKey = 'Event'; i = 0; gain = 5 * bestValue(b) * totalMult(); rar = 'Exotic'; ach('golden'); }
  else if (special === 'meteor' && rnd(1, 4) === 1) { gemKey = 'Event'; i = 1; gain = 3 * bestValue(b) * totalMult(); rar = 'Secret'; ach('star'); }
  else {
    i = rollMineral(b);
    if (i < 0) {
      rock.state = 'dead'; G.stats.empty++;
      G.floats.push({ x: rock.x, y: rock.y, text: 'empty...', col: '#9aa0aa', t: 0, size: 13 });
      AUDIO.sfx('empty');
      checkAch();
      return;
    }
    gain = b.minerals[i][1] * totalMult(); rar = b.minerals[i][2];
  }
  giveCreditz(gain);
  G.stats.minerals++;
  const first = addFound(gemKey, i);
  rock.state = 'gem'; rock.gemKey = gemKey; rock.gem = i; rock.gemT = 0; rock.value = gain; rock.rarity = rar;
  const rk = rank(rar);
  G.floats.push({ x: rock.x, y: rock.y + 36, text: '+' + fmt(gain), col: '#ffd84a', t: 0, size: 15 + Math.min(8, rk) });
  sparkle(rock.x, rock.y, RCOL[rar], 8 + rk * 3);
  G.lights.push({ x: rock.x, y: rock.y, r: 50 + rk * 12, col: RCOL[rar], life: 0.6, max: 0.6 });
  if (rk >= 5) { G.flash = 0.25 + rk * 0.02; G.flashCol = RCOL[rar]; G.shake = Math.max(G.shake, 3 + rk * 0.4); toast(rar.toUpperCase() + '!  ' + mineralName(gemKey, i), RCOL[rar]); }
  if (first) G.floats.push({ x: rock.x, y: rock.y + 52, text: 'NEW!', col: '#7dff7a', t: 0, size: 12 });
  AUDIO.sfx('find', rk);
  if (rk >= rank('Mythical')) ach('mythic');
  if (rar === 'Celestial') ach('celestial');
  ach('first');
  checkAch();
}
function mineralName(key, i) { return key === 'Event' ? EVENT_MINERALS[i][0] : ART.gems[key][i].name; }
function hitRock(rock, by) {
  const b = BIOMES[G.biome];
  if (rock.costume < 4) {
    rock.costume++;
    if (b.hitDarken) rock.bright -= 10;
    recolor(rock);
    const wait = by === 'bomb' ? BOMB_STRENGTH[G.bombLevel] : miningSpeed() * b.factor * (by === 'auto' ? AUTO_SLOW : 1);
    rock.cool = wait + DT; rock.coolMax = rock.cool;
    rock.shake = 5; rock.flash = 1;
    chunks(rock.x, rock.y, rock.col, 3, true);
    if (by === 'mouse') { AUDIO.sfx('hit', rock.costume); G.mouse.swing = 1; }
    else if (by === 'auto') AUDIO.sfx('tick');
  } else breakRock(rock);
}
function worldHover() {
  if (G.mouse.onUI || !G.mouse.over) return null;
  const w = toWorld(G.mouse.x, G.mouse.y);
  for (const r of G.rocks) if (r.state === 'rock' && Math.abs(w.x - r.x) <= 24 && Math.abs(w.y - r.y) <= 24) return r;
  if (G.heart && Math.abs(w.x) <= 70 && Math.abs(w.y - 32) <= 70) return G.heart;
  return null;
}
function bombRadius(bo) { const g = ART.bombs[bo.costume]; return 0.42 * g.size * 1.15 * bo.size / 100; }
function bombTouches(bo, rock) {
  const rad = bombRadius(bo);
  const dx = Math.max(Math.abs(bo.x - rock.x) - 25.6, 0), dy = Math.max(Math.abs(bo.y - rock.y) - 25.6, 0);
  return dx * dx + dy * dy <= rad * rad;
}
function dropBomb(wx, wy) {
  if (G.scene !== 'play' || !canLoad() || G.bombCD > 0) return;
  if (G.bombLevel <= 0) { toast('Buy a Bomb in the Shop first!'); return; }
  G.bombCD = bombCooldown();
  const ex = BOMB_EXTRA[G.bombLevel];
  G.bombs.push({ x: wx, y: wy, size: 1 + rnd(ex[0], ex[1]), speed: 100, ghost: 0, dir: 90 + rnd(0, 180), costume: G.bombLevel - 1, hits: new Set(), t: 0 });
  G.stats.bombs++;
  G.shake = Math.max(G.shake, 5 + G.bombLevel * 2.5);
  G.flash = 0.35; G.flashCol = '#ffd27a';
  G.lights.push({ x: wx, y: wy, r: 120 + G.bombLevel * 45, col: '#ffb347', life: 0.8, max: 0.8 });
  smoke(wx, wy, 8 + G.bombLevel * 3, 30 + G.bombLevel * 12);
  for (let i = 0; i < 14 + G.bombLevel * 5; i++) {
    const a = Math.random() * 6.283, v = 3 + Math.random() * (4 + G.bombLevel);
    G.parts.push({ kind: 'spark', x: wx, y: wy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 14 + rnd(0, 10), max: 24, col: '#ffcf5a', s: 2 });
  }
  AUDIO.sfx('bomb', G.bombLevel);
}

// ---------------- events ----------------
function startShower() { G.shower = 15; G.meteorT = 0.5; toast('METEOR SHOWER!', '#ff9a3a'); AUDIO.sfx('alarm'); }
function spawnMeteor() {
  const free = G.rocks.filter(r => r.state === 'rock' && r.spawnT <= 0 && !G.meteors.some(m => m.target === r));
  if (!free.length) return;
  const t = free[Math.floor(Math.random() * free.length)];
  G.meteors.push({ target: t, sx: t.x + 180 + Math.random() * 120, sy: t.y + 300, t: 0, dur: 0.75 + Math.random() * 0.3 });
  AUDIO.sfx('whistle');
}
function meteorImpact(m) {
  const r = m.target;
  G.shake = Math.max(G.shake, 6);
  G.lights.push({ x: r.x, y: r.y, r: 90, col: '#ff8a3a', life: 0.5, max: 0.5 });
  smoke(r.x, r.y, 6, 26);
  for (let i = 0; i < 12; i++) { const a = Math.random() * 6.283, v = 2 + Math.random() * 4; G.parts.push({ kind: 'spark', x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v + 2, life: 16, max: 16, col: '#ffb04a', s: 2 }); }
  AUDIO.sfx('impact');
  if (r.state === 'rock' && G.rocks.indexOf(r) >= 0) { r.costume = 4; breakRock(r, 'meteor'); }
}
function hitHeart(dmg) {
  const h = G.heart;
  h.hp -= dmg; G.heartHP = Math.max(1, h.hp); h.shake = 6; h.flash = 1;
  chunks(rnd(-60, 60), 32 + rnd(-60, 60), '#3d3636', 3, true);
  if (Math.random() < 0.4) sparkle(rnd(-30, 30), 32 + rnd(-30, 30), '#ff7a2a', 3);
  AUDIO.sfx('hit', 4);
  if (h.hp <= 0) {
    G.heart = null; G.won = true; G.heartHP = HEART_HP;
    giveCreditz(1000 * bestValue(BIOMES[G.biome]) * totalMult());
    for (let k = 0; k < 4; k++) chunks(rnd(-60, 60), 32 + rnd(-60, 60), '#3d3636', 12);
    sparkle(0, 32, '#ffd84a', 60); sparkle(0, 32, '#ff5a2a', 40);
    G.lights.push({ x: 0, y: 32, r: 400, col: '#ffd27a', life: 2, max: 2 });
    G.shake = 18; G.flash = 1; G.flashCol = '#fff2c0';
    ach('heart'); AUDIO.sfx('victory');
    G.victory = 0.01;
    save();
  }
}

// ---------------- achievements ----------------
function ach(id) {
  if (G.ach[id]) return;
  const a = ACH.find(x => x[0] === id); if (!a) return;
  G.ach[id] = 1;
  G.achPop.push({ id, t: 0 });
  if (G.scene === 'play') AUDIO.sfx('ach');
}
function checkAch() {
  const c = G.creditz;
  if (c >= 1e3) ach('k1'); if (c >= 1e6) ach('m1'); if (c >= 1e9) ach('b1'); if (c >= 1e12) ach('t1');
  if (G.visited === (1 << BIOMES.length) - 1) ach('explorer');
  if (rebirthsDone() >= 1) ach('reb1'); if (rebirthsDone() >= 5) ach('reb5'); if (rebirthsDone() >= 10) ach('reb10');
  if (G.spLevel >= 5) ach('speed'); if (G.cmLevel >= 7) ach('x100'); if (G.bombLevel >= 5) ach('boom'); if (G.autoLevel >= 5) ach('robots');
  if (G.stats.rocks >= 1000) ach('crusher'); if (G.stats.empty >= 100) ach('empty');
  let all = true;
  for (const b of BIOMES) {
    const f = G.found[b.name] || [];
    const full = b.minerals.every((m, i) => f[i] > 0);
    if (full) ach('page'); else all = false;
  }
  const ev = G.found.Event || [];
  if (all && ev[0] > 0 && ev[1] > 0) ach('all');
}

// ---------------- one game frame (Scratch speed: 30 a second) ----------------
function tick() {
  G.time += DT;
  const b = BIOMES[G.biome];
  if (G.tp < 9) G.tp += DT;
  if (G.flash > 0) G.flash = Math.max(0, G.flash - DT * 1.6);
  G.shake *= 0.86; if (G.shake < 0.05) G.shake = 0;
  G.hudPulse *= 0.88;
  G.shown += (G.creditz - G.shown) * 0.25; if (Math.abs(G.creditz - G.shown) < 1) G.shown = G.creditz;
  for (const k in G.menuT) { const target = G.menu === k ? 1 : 0; G.menuT[k] += (target - G.menuT[k]) * 0.3; if (Math.abs(G.menuT[k] - target) < 0.01) G.menuT[k] = target; }
  if (G.victory > 0 && G.victory < 1) G.victory = Math.min(1, G.victory + DT * 1.5);
  G.mouse.swing *= 0.8;

  if (G.scene === 'play') {
    G.stats.time += DT;
    if (G.gen && G.gen.length) { const s = G.gen.shift(); if (s) spawnRock(s.c, s.r); if (!G.gen.length) G.gen = null; }
    if (G.loading > 0) G.loading--;
    // RegenRocks: all rocks gone -> wait 2 seconds -> new grid (the Heart stays)
    if (!G.gen && G.regenWait < 0 && aliveRocks() < 1) G.regenWait = 2;
    if (G.regenWait >= 0) { G.regenWait -= DT; if (G.regenWait < 0) { G.rocks = G.rocks.filter(r => r.state === 'gem'); makeGrid(); AUDIO.sfx('regen'); } }

    // events
    if (G.shower > 0) {
      G.shower -= DT;
      if ((G.meteorT -= DT) <= 0) { spawnMeteor(); G.meteorT = 0.5 + Math.random() * 0.7; }
    } else if ((G.nextShower -= DT * (perk(5) ? 2 : 1)) <= 0) { G.nextShower = 180 + Math.random() * 150; startShower(); }
    for (const m of G.meteors) { m.t += DT; if (m.t >= m.dur && !m.done) { m.done = true; meteorImpact(m); } }
    G.meteors = G.meteors.filter(m => !m.done);

    // bombs
    if (G.bombCD > 0) G.bombCD -= DT;
    if (G.keys.Space) { const w = toWorld(G.mouse.x, G.mouse.y); dropBomb(w.x, w.y); }
    for (const bo of G.bombs) { bo.size += bo.speed; bo.speed -= 5; bo.ghost += 5; bo.t += DT; }

    // auto miners
    while (G.drills.length < drillCount()) G.drills.push({ target: null, wait: 0.15 * G.drills.length, x: 0, y: 200, spin: Math.random() * 6, hitT: 0 });
    if (G.drills.length > drillCount()) G.drills.length = drillCount();
    for (const d of G.drills) {
      if (d.target && d.target !== G.heart && (d.target.state !== 'rock' || G.rocks.indexOf(d.target) < 0)) d.target = null;
      if (d.target === G.heart && !G.heart) d.target = null;
      if (!d.target && (d.wait -= DT) <= 0) {
        const free = G.rocks.filter(r => r.state === 'rock' && r.spawnT <= 0 && !G.drills.some(o => o.target === r));
        if (free.length) d.target = free[Math.floor(Math.random() * free.length)];
        else if (G.heart) d.target = G.heart;
        d.wait = 0.4;
      }
      const tx = d.target ? (d.target === G.heart ? (d.spin % 2 - 1) * 50 : d.target.x) + 16 : d.x, ty = d.target ? (d.target === G.heart ? 32 : d.target.y) + 26 : d.y;
      d.x += (tx - d.x) * 0.18; d.y += (ty - d.y) * 0.18;
      if (d.hitT > 0) d.hitT -= DT;
    }

    // who is hitting what?
    const hover = worldHover();
    for (const rock of G.rocks) {
      if (rock.shake > 0) rock.shake--;
      if (rock.flash > 0) rock.flash = Math.max(0, rock.flash - 0.2);
      if (rock.state === 'gem') { rock.gemT += DT; if (rock.gemT >= 2.6) rock.state = 'dead'; if (rock.gemT >= 2 && !rock.flew) { rock.flew = true; } continue; }
      if (rock.state !== 'rock') continue;
      if (rock.spawnT > 0) { rock.spawnT -= DT; continue; }
      if (rock.cool > 0) { rock.cool -= DT; continue; }
      let by = null;
      const bomb = G.bombs.find(bo => bombTouches(bo, rock));
      if (bomb) { by = 'bomb'; bomb.hits.add(rock); if (bomb.hits.size >= 15) ach('kaboom'); }
      else if (hover === rock && G.mouse.down) by = 'mouse';
      else { const d = G.drills.find(d => d.target === rock); if (d) { by = 'auto'; d.hitT = 0.15; } }
      if (by) hitRock(rock, by);
    }
    G.rocks = G.rocks.filter(r => r.state !== 'dead');
    // the Heart of the Mountain
    if (G.heart) {
      const h = G.heart;
      if (h.shake > 0) h.shake--; if (h.flash > 0) h.flash = Math.max(0, h.flash - 0.15);
      for (const bo of G.bombs) if (!bo.heartHit && bombRadius(bo) > Math.hypot(bo.x, bo.y - 32) - 72) { bo.heartHit = true; hitHeart(8 * G.bombLevel); if (!G.heart) break; }
      if (G.heart && (h.cool -= DT) <= 0) {
        if (hover === h && G.mouse.down) { hitHeart(1); h.cool = Math.max(0.12, miningSpeed() * 0.5); G.mouse.swing = 1; }
        else { const d = G.drills.find(d => d.target === h); if (d) { hitHeart(1); h.cool = 0.6; d.hitT = 0.15; } }
      }
    }
    G.bombs = G.bombs.filter(bo => bo.speed >= 0);
    if ((G.saveT += DT) > 3) { G.saveT = 0; save(); checkAch(); }
  }

  // effects
  for (const p of G.parts) {
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.kind === 'chunk') { p.vy -= 0.45; p.rot += p.vr; if (p.y < -105 && p.vy < 0 && !p.bounced) { p.vy *= -0.35; p.vx *= 0.6; p.bounced = true; } }
    else if (p.kind === 'spark') { p.vx *= 0.92; p.vy = p.vy * 0.92 - 0.12; }
    else if (p.kind === 'dust' || p.kind === 'smoke') { p.vx *= 0.93; p.vy = p.vy * 0.93 + (p.kind === 'smoke' ? 0.05 : 0.01); p.s += p.grow || 0.4; }
    else if (p.kind === 'star') { p.vx *= 0.94; p.vy = p.vy * 0.94 - 0.03; }
  }
  G.parts = G.parts.filter(p => p.life > 0);
  if (G.parts.length > 700) G.parts.splice(0, G.parts.length - 700);
  for (const l of G.lights) l.life -= DT;
  G.lights = G.lights.filter(l => l.life > 0);
  for (const f of G.floats) { f.t += DT; f.y += 0.9; }
  G.floats = G.floats.filter(f => f.t < 1.5);
  for (const t of G.toasts) t.t += DT;
  G.toasts = G.toasts.filter(t => t.t < 2.6);
  for (const a of G.achPop) a.t += DT;
  G.achPop = G.achPop.filter(a => a.t < 4);
  if (G.confirmNew > 0) G.confirmNew -= DT;
  tickAmbient();
  if (G.creditz > G.high) G.high = G.creditz;
}
// ---------------- particles ----------------
function chunks(x, y, col, n, small) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = (small ? 1.5 : 2.5) + Math.random() * (small ? 2 : 4);
    G.parts.push({ kind: 'chunk', x: x + rnd(-12, 12), y: y + rnd(-12, 12), vx: Math.cos(a) * v, vy: Math.sin(a) * v + 3, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.5,
      s: small ? rnd(2, 4) : rnd(4, 9), col: Math.random() < 0.5 ? col : darken(col, 0.25), life: 30 + rnd(0, 25), max: 55, pts: [Math.random(), Math.random(), Math.random()] });
  }
}
function dust(x, y, col, n) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = 0.5 + Math.random() * 1.5; G.parts.push({ kind: 'dust', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: 10 + rnd(0, 10), life: 24 + rnd(0, 14), max: 38, col: lighten(col, 0.3) }); }
}
function smoke(x, y, n, sz) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = 1 + Math.random() * 3; G.parts.push({ kind: 'smoke', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: sz * (0.5 + Math.random() * 0.6), grow: 0.8, life: 30 + rnd(0, 20), max: 50, col: '#4a4540' }); }
}
function sparkle(x, y, col, n) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = 1 + Math.random() * 4; G.parts.push({ kind: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v + 1, s: 2 + Math.random() * 3, life: 20 + rnd(0, 20), max: 40, col }); }
}
function toast(text, col) {
  const last = G.toasts[G.toasts.length - 1];
  if (last && last.text === text) { last.t = Math.min(last.t, 0.3); return; }
  G.toasts.push({ text, t: 0, col: col || '#ffffff' });
  if (G.toasts.length > 3) G.toasts.shift();
}

// ---------------- ambient effects per biome (screen space, 0..1 coordinates) ----------------
function tickAmbient() {
  const type = G.scene === 'title' ? 'dust' : BIOMES[G.biome].amb;
  const A = G.amb, R = Math.random;
  const want = { dust: 40, sparks: 26, heavy: 45, shimmer: 50, embers: 55, snow: 110, bubbles: 40, void: 70 }[type];
  while (A.length < want) {
    const p = { x: R(), y: R(), t: 0, life: 4 + R() * 6, s: R(), ph: R() * 6.28, type };
    if (type === 'embers' || type === 'bubbles') p.y = 1 + R() * 0.2;
    if (type === 'snow' || type === 'heavy') p.y = -R() * 0.2;
    A.push(p);
  }
  for (const p of A) {
    p.t += DT;
    if (p.type === 'dust') { p.x += Math.sin(G.time * 0.3 + p.ph) * 0.0004; p.y += 0.0002; }
    else if (p.type === 'heavy') { p.y += 0.0012 + p.s * 0.001; p.x += Math.sin(G.time + p.ph) * 0.0006; }
    else if (p.type === 'embers') { p.y -= 0.002 + p.s * 0.002; p.x += Math.sin(G.time * 2 + p.ph) * 0.001; }
    else if (p.type === 'snow') { p.y += 0.0015 + p.s * 0.0025; p.x += Math.sin(G.time * 1.3 + p.ph) * 0.0012 + 0.0004; }
    else if (p.type === 'bubbles') { p.y -= 0.0012 + p.s * 0.0012; p.x += Math.sin(G.time * 3 + p.ph) * 0.0006; }
    else if (p.type === 'void') { const dx = 0.5 - p.x, dy = 0.5 - p.y, d = Math.hypot(dx, dy) + 0.01; p.x += dx / d * 0.0012 - dy / d * 0.0018; p.y += dy / d * 0.0012 + dx / d * 0.0018; if (d < 0.03) p.t = 99; }
    else if (p.type === 'sparks') { p.x += Math.cos(p.ph) * 0.004; p.y += Math.sin(p.ph) * 0.004; if (R() < 0.05) p.ph += (R() - 0.5) * 2; }
  }
  G.amb = A.filter(p => p.t < p.life && p.y < 1.25 && p.y > -0.25 && p.x > -0.1 && p.x < 1.1 && p.type === type);
  if (type === 'sparks' && R() < 0.012) G.arc = { t: 0, pts: arcPts() };
  if (G.arc) { G.arc.t += DT; if (G.arc.t > 0.25) G.arc = null; }
}
function arcPts() {
  const pts = [], x0 = Math.random(), y0 = Math.random() * 0.3, x1 = x0 + (Math.random() - 0.5) * 0.4, y1 = y0 + 0.2 + Math.random() * 0.3;
  for (let i = 0; i <= 10; i++) pts.push([x0 + (x1 - x0) * i / 10 + (Math.random() - 0.5) * 0.03, y0 + (y1 - y0) * i / 10 + (Math.random() - 0.5) * 0.03]);
  return pts;
}

// ---------------- shop / menus / rebirth ----------------
function buy(kind) {
  const u = SHOP[kind], key = LVL_KEY[kind], lvl = G[key];
  if (lvl >= u.costs.length) return;
  const cost = u.costs[lvl];
  if (G.creditz < cost) { toast('You need ' + fmt(cost) + ' Creditz'); AUDIO.sfx('deny'); return; }
  G.creditz -= cost; G[key] = lvl + 1;
  AUDIO.sfx('buy');
  G.hudPulse = 1;
  checkAch(); save();
}
function teleport(i) {
  if (!canLoad()) return;
  if (G.creditz < BIOMES[i].req) { toast('You need ' + fmt(BIOMES[i].req) + ' Creditz to go there'); AUDIO.sfx('deny'); return; }
  loadBiome(i, true);
  AUDIO.sfx('teleport');
  checkAch(); save();
}
function tryRebirth() {
  if (G.creditz < rebirthCost()) { toast('You need ' + fmt(rebirthCost()) + ' Creditz to Rebirth'); AUDIO.sfx('deny'); return; }
  G.rebirthMult *= 2;               // his "change RebirthMultiplier by RebirthMultiplier"
  G.rebirths++;
  G.creditz = 0; G.shown = 0; G.bombLevel = 0; G.autoLevel = 0;
  G.cmLevel = perk(6) ? 1 : 0;
  G.spLevel = perk(10) ? 2 : perk(2) ? 1 : 0;
  const unlocked = PERKS.find(p => p[0] === rebirthsDone());
  loadBiome(0, true);
  G.tpName = 'REBIRTH ' + rebirthsDone();
  toast('Every mineral is now worth x' + fmt(G.rebirthMult) + '!', '#ffd84a');
  if (unlocked) toast('New perk: ' + unlocked[1], '#7dff7a');
  if (rebirthsDone() === HEART_REBIRTHS && !G.won) toast('Something woke up deep in Void Valley...', '#b678ff');
  G.flash = 1; G.flashCol = '#fff2c0';
  AUDIO.sfx('rebirth');
  checkAch(); save();
}
function openMenu(m) {
  if (m && !canLoad()) return;
  G.menu = G.menu === m ? null : m;
  if (G.menu) { G.menuT[G.menu] = G.menuT[G.menu] || 0; AUDIO.sfx('open'); }
}
function startGame(fresh) {
  if (fresh) {
    wipeSave();
    Object.assign(G, { creditz: 0, shown: 0, high: 0, cmLevel: 0, spLevel: 0, bombLevel: 0, autoLevel: 0, rebirths: 1, rebirthMult: 1, biome: 0,
      found: {}, ach: {}, visited: 1, stats: { rocks: 0, empty: 0, minerals: 0, time: 0, bombs: 0 }, heartHP: HEART_HP, won: false });
  } else loadSave();
  G.scene = 'play';
  G.bombs = []; G.drills = []; G.nextShower = 150 + Math.random() * 90;
  loadBiome(G.biome, true);
  AUDIO.sfx('teleport');
  save();
}

    else txt('Event minerals', 350, 92, 16, '#ffffff');
    list.forEach((m, i) => {
      const x = 30 + (i % cols) * (cw + 8), y = 108 + Math.floor(i / cols) * (ch + 8), got = found[i] > 0, art = gemArt(key, i), rar = m[2];
      ctx.fillStyle = got ? rgba(RCOL[rar], 0.08) : 'rgba(255,255,255,0.03)'; rr(x, y, cw, ch, 12); ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = got ? rgba(RCOL[rar], 0.5) : 'rgba(255,255,255,0.1)'; ctx.stroke();
      drawGem(art, x + cw / 2, y + 62, 64, got ? { glow: RCOL[rar], rank: rank(rar) } : { silhouette: true });
      const nm = got ? art.name : '???';
      txt(nm, x + cw / 2, y + 116, fitSize(nm, 18, cw - 16), got ? '#ffffff' : '#6a7080');
      txt(got || isEv ? rar : '?', x + cw / 2, y + 136, 12, RCOL[rar], { font: FB, weight: 900 });
      const info = isEv ? m[4] : '1 in ' + m[0] + '   +' + fmt(m[1] * b.bonus) + ' Creditz';
      txt(info, x + cw / 2, y + 154, fitSize(info, 11, cw - 12, FB), '#aeb6c6', { font: FB, weight: 800 });
      if (got) txt('found x' + found[i], x + cw / 2, y + 170, 10, '#7dff7a', { font: FB, weight: 900 });
    });
  } else if (T === BIOMES.length + 1) {
    const done = ACH.filter(a => G.ach[a[0]]).length;
    txt('Trophies  ' + done + ' / ' + ACH.length, 350, 92, 16, '#ffffff');
    ACH.forEach((a, i) => {
      const col = i % 3, row = Math.floor(i / 3), x = 30 + col * 214, y = 106 + row * 47, got = G.ach[a[0]];
      ctx.fillStyle = got ? 'rgba(255,216,74,0.1)' : 'rgba(255,255,255,0.03)'; rr(x, y, 206, 42, 9); ctx.fill();
      drawIcon(a[0] === 'heart' ? 'heart' : 'trophy', x + 21, y + 21, 22, got ? '#ffd84a' : '#4a5060');
      txt(a[1], x + 40, y + 14, fitSize(a[1], 14, 160), got ? '#ffffff' : '#7a8090', { align: 'left' });
      txt(a[2], x + 40, y + 30, fitSize(a[2], 10, 160, FB), got ? '#c9cfdc' : '#6a7080', { align: 'left', font: FB, weight: 800 });
    });
  } else {
    txt('Rebirth perks  -  you have rebirthed ' + rebirthsDone() + ' times', 350, 92, 16, '#ffffff');
    PERKS.forEach((p, i) => {
      const y = 112 + i * 38, got = perk(p[0]);
      ctx.fillStyle = got ? 'rgba(125,255,122,0.08)' : 'rgba(255,255,255,0.03)'; rr(60, y, 580, 32, 8); ctx.fill();
      if (got) drawIcon('check', 82, y + 16, 18, '#7dff7a'); else drawIcon('lock', 82, y + 16, 16, '#5a6070');
      txt('Rebirth ' + p[0], 104, y + 16, 14, got ? '#7dff7a' : '#7a8090', { align: 'left' });
      txt(p[1], 210, y + 16, 14, got ? '#ffffff' : '#8a90a0', { align: 'left', font: FB, weight: 800 });
    });
    const gy = 112 + PERKS.length * 38 + 14;
    ctx.fillStyle = 'rgba(255,120,40,0.1)'; rr(60, gy, 580, 50, 10); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,140,60,0.6)'; ctx.stroke();
    drawIcon('heart', 86, gy + 25, 26, '#ff6a1a');
    txt(G.won ? 'You broke the Heart of the Mountain. You beat Just Mine!' : 'FINAL GOAL: rebirth ' + HEART_REBIRTHS + ' times, then break the Heart of the Mountain in Void Valley', 108, gy + 25, 13, G.won ? '#7dff7a' : '#ffb36a', { align: 'left', font: FB, weight: 900 });
  }
  ctx.globalAlpha = 1;
}

// ---------------- overlays: teleport, flash, victory ----------------
function renderOverlays() {
  setScreen();
  if (G.flash > 0) { ctx.fillStyle = rgba(G.flashCol, Math.min(0.6, G.flash * 0.6)); ctx.fillRect(0, 0, W, H); }
  if (G.tp < 2.2) {
    const t = G.tp, b = BIOMES[G.biome];
    // iris opening + warp streaks
    if (t < 1) {
      const r = ease(t / 0.9) * Math.hypot(W, H) * 0.6;
      ctx.fillStyle = '#040408'; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(W / 2, H / 2, Math.max(1, r), 0, 6.283, true); ctx.fill('evenodd');
      ctx.lineWidth = 6; ctx.strokeStyle = rgba(b.accent, 1 - t); ctx.beginPath(); ctx.arc(W / 2, H / 2, Math.max(1, r), 0, 6.283); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      const R = seeded(77);
      for (let k = 0; k < 40; k++) { const a = R() * 6.283, d0 = r * (0.3 + R() * 0.7), len = 40 + R() * 120; ctx.strokeStyle = rgba(b.accent, (1 - t) * 0.6); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * d0, H / 2 + Math.sin(a) * d0); ctx.lineTo(W / 2 + Math.cos(a) * (d0 + len), H / 2 + Math.sin(a) * (d0 + len)); ctx.stroke(); }
      ctx.globalCompositeOperation = 'source-over';
    }
    const ta = clamp(Math.min((t - 0.15) * 4, (2.2 - t) * 2), 0, 1);
    if (ta > 0) {
      ctx.globalAlpha = ta; const sc = 0.8 + 0.2 * easeBack(clamp((t - 0.15) * 3, 0, 1));
      ctx.save(); ctx.translate(W / 2, H / 2 - 20); ctx.scale(sc, sc);
      txt(G.tpName, 0, 0, fitSize(G.tpName, 56, W - 40), '#ffffff', { stroke: 7 });
      ctx.fillStyle = b.accent; ctx.fillRect(-120, 34, 240, 3);
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }
  if (G.victory > 0) {
    const t = G.victory;
    ctx.fillStyle = 'rgba(4,4,8,' + 0.75 * t + ')'; ctx.fillRect(0, 0, W, H);
    uiFrame(W / 2 - 260 * Math.min(1, W / 560), H / 2 - 190, Math.min(1, W / 560));
    ctx.globalAlpha = t;
    panel(0, 0, 520, 380, 'VICTORY', '#ff8a2a');
    drawIcon('heart', 260, 70, 60, '#ff6a1a');
    txt('YOU BEAT JUST MINE ©', 260, 130, 32, '#ffd84a', { stroke: 5 });
    txt('You broke the Heart of the Mountain!', 260, 164, 15, '#ffffff', { font: FB, weight: 800 });
    const st = G.stats, mins = Math.floor(st.time / 60);
    const lines = ['Time mined: ' + Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm', 'Rocks broken: ' + fmt(st.rocks) + '   Minerals: ' + fmt(st.minerals), 'Rebirths: ' + rebirthsDone() + '   Best: ' + fmt(G.high) + ' Creditz', 'Trophies: ' + ACH.filter(a => G.ach[a[0]]).length + ' / ' + ACH.length];
    lines.forEach((l, i) => txt(l, 260, 200 + i * 22, 14, '#c9cfdc', { font: FB, weight: 800 }));
    btn('keepmining', 160, 300, 200, 50, 'Keep mining', { col: '#3aa04a', size: 22, fn: () => { G.victory = 0; AUDIO.sfx('click'); } });
    ctx.globalAlpha = 1;
  }
}

// ---------------- title screen ----------------
const DECO = [];
function renderTitle() {
  setScreen();
  if (!DECO.length) for (let i = 0; i < 16; i++) DECO.push({ b: rnd(0, BIOMES.length - 1), g: Math.random(), x: Math.random(), y: Math.random(), v: 0.2 + Math.random() * 0.6, r: Math.random() * 6 });
  for (const d of DECO) {
    d.y += d.v * 0.0008; d.r += 0.004;
    if (d.y > 1.15) { d.y = -0.15; d.x = Math.random(); }
    const list = ART.gems[BIOMES[d.b].name], art = list[Math.floor(d.g * list.length)];
    drawGem(art, d.x * W, d.y * H, 34 + d.v * 30, { alpha: 0.5, rot: d.r, glow: '#ffd27a' });
  }
  const cy = H * 0.3, bob = Math.sin(G.time * 2) * 4;
  ctx.save(); ctx.translate(W / 2, cy + bob);
  const sz = Math.min(110, W / 6.5);
  ctx.font = sz + 'px ' + FH; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = sz * 0.16; ctx.strokeStyle = '#0b0c12'; ctx.strokeText('JUST MINE', 0, 0);
  const g = ctx.createLinearGradient(0, -sz / 2, 0, sz / 2); g.addColorStop(0, '#fff3b0'); g.addColorStop(0.5, '#ffc21a'); g.addColorStop(1, '#c0620a');
  ctx.fillStyle = g; ctx.fillText('JUST MINE', 0, 0);
  ctx.font = sz * 0.35 + 'px ' + FH; const w = ctx.measureText('JUST MINE').width;
  ctx.font = sz + 'px ' + FH; const ww = ctx.measureText('JUST MINE').width;
  txt('©', ww / 2 + sz * 0.22, -sz * 0.3, sz * 0.35, '#ffe27a', { stroke: 4 });
  ctx.save(); ctx.translate(-ww / 2 - sz * 0.45, 0); ctx.rotate(Math.sin(G.time * 3) * 0.2); drawIcon('pick', 0, 0, sz * 0.8, '#d6dde4'); ctx.restore();
  ctx.restore();
  txt('Hold the mouse on rocks to mine them. Find rare minerals. Rebirth. Go deeper.', W / 2, cy + sz * 0.75, fitSize('Hold the mouse on rocks to mine them. Find rare minerals. Rebirth. Go deeper.', 16, W - 40, FB), '#d6dbe6', { font: FB, weight: 800 });
  const save = hasSave(), bw = 240, by = H * 0.56;
  btn('play', W / 2 - bw / 2, by, bw, 60, save ? 'Continue' : 'Play', { col: '#3aa04a', size: 28, fn: () => { AUDIO.init(); AUDIO.sfx('click'); G.confirmNew = 0; startGame(false); } });
  if (save) btn('new', W / 2 - bw / 2 + 30, by + 74, bw - 60, 40, G.confirmNew > 0 ? 'Sure? Click again' : 'New game', { col: G.confirmNew > 0 ? '#b03a3a' : '#4a5470', size: 17,
    fn: () => { AUDIO.init(); AUDIO.sfx('click'); if (G.confirmNew > 0) { G.confirmNew = 0; startGame(true); } else G.confirmNew = 3; } });
  setScreen();
  txt('SPACE or right-click = Bomb    B Biomes  -  S Shop  -  R Rebirth  -  K Book  -  M mute', W / 2, H - 52, fitSize('SPACE or right-click = Bomb    B Biomes  -  S Shop  -  R Rebirth  -  K Book  -  M mute', 13, W - 30, FB), '#9aa3b5', { font: FB, weight: 800 });
  if (G.high > 0) txt('BEST  ' + fmt(G.high) + ' Creditz', W / 2, H - 76, 15, '#ffd84a', { font: FB, weight: 900 });
  txt('a game by Sixten', W - 16, H - 20, 13, '#8a90a0', { align: 'right', font: FB, weight: 800 });
}

// ====================================================================
//  INPUT
// ====================================================================
function setMouse(e) { G.mouse.x = e.clientX; G.mouse.y = e.clientY; G.mouse.over = true; }
function hitRegion(x, y) { for (let i = UI.regions.length - 1; i >= 0; i--) { const r = UI.regions[i]; if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r; } return null; }
cv.addEventListener('pointermove', e => setMouse(e));
cv.addEventListener('pointerdown', e => {
  setMouse(e);
  AUDIO.init();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const r = hitRegion(G.mouse.x, G.mouse.y);
  if (r) { if (r.fn && e.button === 0) r.fn(); G.mouse.down = false; G.mouse.onUI = true; return; }
  if (G.scene !== 'play') return;
  if (e.button === 2) { const w = toWorld(G.mouse.x, G.mouse.y); dropBomb(w.x, w.y); return; }
  G.mouse.down = true;
});
window.addEventListener('pointerup', () => { G.mouse.down = false; });
cv.addEventListener('pointerleave', () => { G.mouse.over = false; G.mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  AUDIO.init();
  if (e.code === 'Space') { G.keys.Space = true; e.preventDefault(); }
  if (e.code === 'Escape') { G.menu = null; if (G.victory) G.victory = 0; }
  if (e.code === 'KeyM') { G.settings.vol = G.settings.vol === 3 ? 0 : 3; AUDIO.applyVolume(); save(); }
  if (G.scene === 'play' && !e.repeat) {
    const m = { KeyB: 'biomes', KeyS: 'shop', KeyR: 'rebirth', KeyK: 'book' }[e.code];
    if (m) { AUDIO.sfx('click'); openMenu(m); }
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') G.keys.Space = false; });
window.addEventListener('blur', () => { G.keys.Space = false; G.mouse.down = false; });
window.addEventListener('resize', resize);
window.addEventListener('beforeunload', () => { if (G.scene === 'play') save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.scene === 'play') save(); });

// ====================================================================
//  START + MAIN LOOP (fixed 30 game frames a second, drawing every screen frame)
// ====================================================================
resize();
function ready() { loadSave(); G.scene = 'title'; AUDIO.setSong(0); }
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('40px "Lilita One"'), document.fonts.load('900 16px "Nunito"')]).catch(() => {}).then(() => { bgKey = ''; ready(); });
  setTimeout(() => { if (G.scene === 'loading') ready(); }, 2500);   // offline? use fallback fonts
} else ready();
let last = 0, acc = 0;
function frame(t) {
  if (!last) last = t;
  acc += Math.min(0.25, (t - last) / 1000); last = t;
  while (acc >= DT) { tick(); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__JM = { HEART: HEART_REBIRTHS, G, tick, render, BIOMES, SHOP, ART, UI, startGame, buy, teleport, tryRebirth, loadBiome, openMenu, dropBomb, miningSpeed, rebirthCost, canLoad, creditzMult, totalMult, perk, toScreen, toWorld, hitRegion, checkAch, startShower, resize };
</script>
