// ---------------- ambient effects per biome (screen space, 0..1 coordinates) ----------------
const AMBM = () => [0, 0.5, 1][gx('amb')] * (QUALITY.drop ? 0.6 : 1);   // Weather setting
function tickAmbient() {
  const type = G.scene === 'title' ? 'dust' : BIOMES[G.biome].amb;
  const A = G.amb, R = Math.random;
  const want = AMB_X[type] ? Math.round(AMB_X[type].n * AMBM()) : Math.round({ dust: 40, sparks: 26, heavy: 45, shimmer: 50, embers: 55, snow: 110, bubbles: 40, void: 70, sand: 70, jungle: 34, storm: 120, lava: 50 }[type] * AMBM());
  if (A.length > want) A.splice(want);
  while (A.length < want) {
    const p = { x: R(), y: R(), t: 0, life: 4 + R() * 6, s: R(), ph: R() * 6.28, type };
    if (type === 'embers' || type === 'bubbles' || type === 'lava') p.y = 1 + R() * 0.2;
    if (type === 'snow' || type === 'heavy' || type === 'storm') p.y = -R() * 0.2;
    if (type === 'sand') p.x = -R() * 0.2;
    if (AMB_X[type]) { const m = AMB_X[type].move; if (m === 'rise') p.y = 1 + R() * 0.2; if (m === 'fall') p.y = -R() * 0.2; if (m === 'side') p.x = -R() * 0.2; }
    A.push(p);
  }
  for (const p of A) {
    p.t += DT;
    if (p.type === 'dust') { p.x += Math.sin(G.time * 0.3 + p.ph) * 0.0004; p.y += 0.0002; }
    else if (p.type === 'heavy') { p.y += 0.0012 + p.s * 0.001; p.x += Math.sin(G.time + p.ph) * 0.0006; }
    else if (p.type === 'embers' || p.type === 'lava') { p.y -= 0.002 + p.s * 0.002; p.x += Math.sin(G.time * 2 + p.ph) * 0.001; }
    else if (p.type === 'snow') { p.y += 0.0015 + p.s * 0.0025; p.x += Math.sin(G.time * 1.3 + p.ph) * 0.0012 + 0.0004; }
    else if (p.type === 'bubbles') { p.y -= 0.0012 + p.s * 0.0012; p.x += Math.sin(G.time * 3 + p.ph) * 0.0006; }
    else if (p.type === 'void') { const dx = 0.5 - p.x, dy = 0.5 - p.y, d = Math.hypot(dx, dy) + 0.01; p.x += dx / d * 0.0012 - dy / d * 0.0018; p.y += dy / d * 0.0012 + dx / d * 0.0018; if (d < 0.03) p.t = 99; }
    else if (p.type === 'sparks') { p.x += Math.cos(p.ph) * 0.004; p.y += Math.sin(p.ph) * 0.004; if (R() < 0.05) p.ph += (R() - 0.5) * 2; }
    else if (p.type === 'sand') { const gust = 1 + Math.max(0, Math.sin(G.time * 0.7)) * 2; p.x += (0.003 + p.s * 0.004) * gust; p.y += Math.sin(G.time * 2 + p.ph) * 0.0008; }
    else if (p.type === 'jungle') { if (p.s > 0.4) { p.x += Math.cos(G.time * 0.8 + p.ph) * 0.0009; p.y += Math.sin(G.time * 1.1 + p.ph) * 0.0009; } else { p.y += 0.0012; p.x += Math.sin(G.time * 2 + p.ph) * 0.0012; } }
    else if (p.type === 'storm') { p.y += 0.02 + p.s * 0.01; p.x -= 0.004; }
    else if (AMB_X[p.type]) { const m = AMB_X[p.type].move;
      if (m === 'rise') { p.y -= 0.0012 + p.s * 0.0015; p.x += Math.sin(G.time * 1.5 + p.ph) * 0.0008; }
      else if (m === 'fall') { p.y += 0.0012 + p.s * 0.002; p.x += Math.sin(G.time + p.ph) * 0.0008; }
      else if (m === 'side') { p.x += 0.0008 + p.s * 0.0008; }
      else if (m === 'drift') { p.x += Math.sin(G.time * 0.5 + p.ph) * 0.0008; p.y += Math.cos(G.time * 0.4 + p.ph) * 0.0006; } }
  }
  G.amb = A.filter(p => p.t < p.life && p.y < 1.25 && p.y > -0.25 && p.x > -0.25 && p.x < 1.1 && p.type === type);
  if (type === 'sparks' && R() < 0.012) G.arc = { t: 0, pts: arcPts() };
  if (G.arc) { G.arc.t += DT; if (G.arc.t > 0.25) G.arc = null; }

  if (type === 'storm' && G.scene === 'play' && R() < 0.006) { G.bolt = { t: 0, pts: boltPts() }; G.flash = Math.max(G.flash, 0.22); G.flashCol = '#dfe8ff'; AUDIO.sfx('thunder'); }

}

// ====================================================================
//  DRONES: buy crates -> get drones -> merge them -> put them in slots -> they mine for you
//  Each drone in your collection is a tiny object: { id, type, rank, skin, hat }.
//  While a drone sits in a slot it also gets a "runtime" object (position, target, cooldown...)
//  in DRT, which is NOT saved - it's rebuilt when the game starts.
// ====================================================================
const DRONE_TYPES = {
  normal: { name: 'Drone', rar: 'Common', col: '#4ad0ff', ai: 'drill', cd: 2.6, desc: 'Flies to a rock and drills it' },
  bomber: { name: 'Bomblayer', rar: 'Uncommon', col: '#ff8a3a', ai: 'bomb', cd: 5.5, desc: 'Wanders around laying small bombs. Hunts down the last rock' },
  heavy: { name: 'Heavy', rar: 'Rare', col: '#ffc21a', ai: 'heavy', cd: 10, desc: 'Smashes itself down: hits a 3x3 area' },
  laser: { name: 'Laser', rar: 'Mythical', col: '#ff3a5a', ai: 'laser', cd: 12, desc: 'Fires a laser that burns through rocks one at a time' },
  drillbomber: { name: 'Drillbomber', rar: 'Epic', col: '#ff5ab0', ai: 'bomb', cd: 7, desc: 'Its bombs shoot small drills in 4 directions' },
  heavylaser: { name: 'Heavy Laser', rar: 'Mythical', col: '#ff2a2a', ai: 'laser', cd: 14.5, desc: 'A huge, wide laser beam: 2 cracks per hit, but slower' },
  laserdriller: { name: 'Laser Driller', rar: 'Mythical', col: '#ff5a9a', ai: 'gatling', cd: 0.4, desc: 'A gatling laser: flies around, turns its aim slowly, rapid weak shots' },
  laserbomber: { name: 'Laser Bomber', rar: 'Mythical', col: '#ff6a3a', ai: 'bomb', cd: 10, desc: 'Its bombs shoot lasers in 8 directions (bigger with rank + level)' },
  bigdrill: { name: 'Big Drill', rar: 'Epic', col: '#5affb0', ai: 'drill', cd: 4.5, desc: 'Drills in a + shape (5 rocks at once)' },
  heavybomber: { name: 'Heavy Bomber', rar: 'Legendary', col: '#ff5a2a', ai: 'bomb', cd: 9, desc: 'Drops one really big bomb' },
  engineer: { name: 'Engineer', rar: 'Epic', col: '#3ad0ff', ai: 'drill', cd: 8, noMix: true, desc: 'Builds Tech parts. Spend them to upgrade any drone forever' },
  mothership: { name: 'Alien Mothership', rar: 'Celestial', col: '#b0ff3a', ai: 'mother', cd: 0, noMix: true, noRank: true, desc: 'Beams 5 minerals at once + launches a fleet. No ranks: XP only' },
  alien: { name: 'Alien Ship', rar: 'Celestial', col: '#7dff3a', ai: 'alien', cd: 0, noMix: true, desc: 'Scans a rock and beams its mineral out. The rock stays, and still has it inside' },
};
const MIXES = { 'bomber+normal': 'drillbomber', 'heavy+normal': 'bigdrill', 'bomber+heavy': 'heavybomber', 'heavy+laser': 'heavylaser', 'laser+normal': 'laserdriller', 'bomber+laser': 'laserbomber' };
const RANK_NAMES = ['', 'I', 'II', 'III', 'IV', 'V'];
const RANK_COL = ['', '#c8d0dc', '#4dff4d', '#2eb0ff', '#ff4be6', '#ffd84a'];
// what a rank gives: cooldown multiplier, cracks per hit, flying speed
const DRONE_NERF = 1.12;   // 2026-11-18: every drone a bit slower
const RK = { cd: [1, 1, 0.85, 0.72, 0.6, 0.5], dmg: [1, 1, 1, 1, 2, 2], spd: [1, 1, 1.15, 1.3, 1.45, 1.6] };   // 2026-11-17: much weaker (they were way too strong)
const ALIEN_CD = [0, 60, 45, 34, 24, 15];
const MOTHER_CD = 26, MOTHER_FLEET_CD = 60, MOTHER_FLEET_T = 15;   // beams 5 at once every 26 s; sends 3 ships for 15 s every 60 s
const slotsFor = () => Math.min(10, 3 + Math.max(0, rebirthsDone()));   // 2026-11-18: slots come from rebirthing
const SLOT_PRICES = [0, 0, 0, 5e6, 5e8, 5e10, 5e12, 5e14, 5e16, 5e18];   // slots 4..10 (pretty expensive!)
const mixKey = (a, b) => [a, b].sort().join('+');
function mergeResult(a, b) {
  if (!a || !b || a === b || a.rank !== b.rank) return null;
  if (DRONE_TYPES[a.type].noRank || DRONE_TYPES[b.type].noRank) return null;
  if (a.type === b.type) return a.rank < 5 ? { type: a.type, rank: a.rank + 1 } : null;
  if (DRONE_TYPES[a.type].noMix || DRONE_TYPES[b.type].noMix) return null;
  const t = MIXES[mixKey(a.type, b.type)];
  return t ? { type: t, rank: a.rank } : null;
}
function mergeWhy(a, b) {
  if (DRONE_TYPES[a.type].noRank || DRONE_TYPES[b.type].noRank) return 'The Alien Mothership can\'t merge: it only grows with XP (levels)';
  if (a.type !== b.type && (DRONE_TYPES[a.type].noMix || DRONE_TYPES[b.type].noMix)) return DRONE_TYPES[DRONE_TYPES[a.type].noMix ? a.type : b.type].name + ' drones only merge with their own kind';
  if (a.rank !== b.rank) return 'Only drones of the same rank can merge';
  if (a.type === b.type) return 'Already the highest rank (V)';
  return 'These two can\'t be mixed';
}
const droneName = d => DRONE_TYPES[d.type].noRank ? DRONE_TYPES[d.type].name : DRONE_TYPES[d.type].name + ' ' + RANK_NAMES[d.rank];
const droneById = id => G.drones.find(d => d.id === id);
function activeDrones() { const a = deployed(); if (G.minis && G.minis.length) for (const m of G.minis) a.push(m.d); return a; }
function deployed() { const out = []; for (let k = 0; k < G.slotsOpen; k++) { const d = G.slots[k] && droneById(G.slots[k]); if (d) out.push(d); } return out; }

const slotOf = d => G.slots.indexOf(d.id);
function addDrone(type, rank) {
  const d = { id: G.nextId++, type, rank: clamp(rank, 1, 5), skin: null, hat: null, lvl: 1, xp: 0, mods: cleanMods(null) };
  G.dseen = G.dseen || {}; G.dseen[type] = 1;
  G.drones.push(d);
  for (let k = 0; k < G.slotsOpen; k++) if (!G.slots[k] || !droneById(G.slots[k])) { G.slots[k] = d.id; break; }   // fill an empty slot right away

}
// DRONE LEVELS (not the same as ranks!): a drone in a slot gains 1 XP every second.
// Level 2 needs 10 XP, each next level 33% more, max level 25 (about 10 hours in a slot).
const DRONE_MAX_LVL = 25;
const dXpNeed = l => Math.round(10 * Math.pow(1.33, l - 1));   // XP to go from level l to l+1
const dLvl = d => d.lvl || 1;
// what levels give: shorter cooldown, faster flying, extra crack chance, bigger abilities, and a smarter brain at 10 + 20
const lvlCd = d => 1 - 0.02 * (dLvl(d) - 1);
const lvlSpd = d => 1 + 0.025 * (dLvl(d) - 1);
const modOf = (d, k) => (d && d.mods && d.mods[k]) || 0;   // Engineer upgrades on a drone (0..5 each)
const MOD_MAX = 5, MODS = [['cd', 'Cooldown', '-6%'], ['spd', 'Speed', '+8%'], ['crit', 'Crack', '+4%']];
const modCost = lv => (lv + 1) * 2;
const techTime = d => 80 * RK.cd[d.rank] * lvlCd(d);   // seconds per Tech part for one Engineer
const cleanMods = m => ({ cd: clamp((m && m.cd) | 0, 0, MOD_MAX), spd: clamp((m && m.spd) | 0, 0, MOD_MAX), crit: clamp((m && m.crit) | 0, 0, MOD_MAX) });
const lvlCrit = d => 0.01 * (dLvl(d) - 1) + 0.04 * modOf(d, 'crit');
const lvlAbility = d => 1 + 0.02 * (dLvl(d) - 1);
const aiRank = d => Math.min(5, d.rank + (dLvl(d) >= 10 ? 1 : 0) + (dLvl(d) >= 20 ? 1 : 0));
function droneCd(d) { return (d.type === 'mothership' ? MOTHER_CD : d.type === 'alien' ? ALIEN_CD[d.rank] : DRONE_TYPES[d.type].cd * RK.cd[d.rank]) * upv('dspeed', 1) * lvlCd(d) * DRONE_NERF * (d.skin === 'striker' ? 0.85 : 1) * (1 - 0.06 * modOf(d, 'cd')) * (perk(13) ? 0.85 : 1); }
function droneXp(d, s) {
  if (dLvl(d) >= DRONE_MAX_LVL) return;
  d.xp = (d.xp || 0) + DT;
  if (d.xp >= dXpNeed(dLvl(d))) {
    d.xp -= dXpNeed(dLvl(d)); d.lvl = dLvl(d) + 1;
    s.lvlFx = 1.4;   // yellow flash
    G.floats.push({ x: s.x, y: s.y + 26, text: 'LEVEL UP! Level ' + d.lvl, col: '#ffe14a', t: 0, size: 13 });
    G.lights.push({ x: s.x, y: s.y, r: 70, col: '#ffe14a', life: 0.6, max: 0.6 });
    sparkle(s.x, s.y, '#ffe14a', 10);
    droneSfx(d, 'dlevel');
    if (d.lvl === 10 || d.lvl === 20) toast(droneName(d) + ' got smarter! (Lv ' + d.lvl + ')', '#ffe14a');
  }
}

  let n = 0, again = true;

    for (const k in groups) {

const VAULT_KEY = 'justmine.vault.v1';
function keepCodeSkins() {
  let v = []; try { v = JSON.parse(localStorage.getItem(VAULT_KEY) || '[]'); } catch (e) {}
  if (!Array.isArray(v)) v = [];
  const all = [...new Set(v.concat(G.codes || []))].filter(h => CODES[h]);

async function codeHash(c) { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(c)); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''); }

  const c = await codeHash(String(raw || '').trim().toLowerCase().replace(/\s+/g, ''));
  const C = CODES[c]; if (!C) return 'That code does not exist';
  if (!CODES_OPEN && !C.open) return 'That code is closed';   // only codes marked open still work
  const lost = G.codes.includes(c) && C.skin && !(G.skins[C.skin] > 0);   // used it before but the skin is gone: give it back
  if (G.codes.includes(c) && !lost) return 'You already used this code';
  if (!lost) G.codes.push(c);
  if (C.skin) G.skins[C.skin] = (G.skins[C.skin] || 0) + 1;

// ====================================================================
//  ONLINE: accounts (username + password) and the leaderboard, using Supabase.
//  Supabase = a free online SQL database (PostgreSQL, a cousin of MySQL) with a login system built in.
//  The game NEVER sees or stores your password: Supabase scrambles it (hashing) and only keeps the scramble.
//  The "key" below is meant to be public. What keeps the data safe are the rules in setup.sql
//  ("Row Level Security": everybody may READ the leaderboard, but you may only change YOUR OWN row).
// ====================================================================
const ONLINE_UI = false;   // log in + leaderboard buttons: hidden until the game server exists
const CLOUD = { url: '', key: '' };   // filled in after the Supabase project exists (see SETUP-ONLINE.md)
const cloudOn = () => !!(CLOUD.url && CLOUD.key);
const NET = { sb: null, user: null, name: null, err: '', board: {}, boardT: {}, me: {}, busy: {}, lastPush: 0, ready: false };
const BOARDS = [['best', 'Best Creditz', v => fmt(v)], ['rebirths', 'Rebirths', v => String(v)], ['pass_lvl', 'Alien Pass', v => 'Lv ' + v]];
const USER_RE = /^[A-Za-z0-9_]{3,16}$/;
const BAD = ['fuck', 'shit', 'bitch', 'nigg', 'cunt', 'dick', 'penis', 'porn', 'sex', 'nazi', 'hitler', 'fag', 'rape', 'whore', 'slut'];
const badName = u => BAD.some(w => u.toLowerCase().includes(w));
// Supabase logins need an e-mail, but kids shouldn't have to give one. So the username becomes a pretend address.
const fakeEmail = u => u.toLowerCase() + '@players.justmine.game';
function loadSupabase() {
  return new Promise((res, rej) => {
    if (window.supabase) return res();
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
    sc.onload = () => res(); sc.onerror = () => rej(new Error('offline'));
    document.head.appendChild(sc);
  });
}
async function netInit() {
  if (!cloudOn() || NET.sb) return;
  try {
    await loadSupabase();
    NET.sb = window.supabase.createClient(CLOUD.url, CLOUD.key, { auth: { persistSession: true, storageKey: 'justmine.auth' } });
    const { data } = await NET.sb.auth.getSession();
    if (data && data.session) await afterLogin(data.session.user);
    NET.ready = true;
  } catch (e) { NET.err = 'Could not reach the leaderboard server'; }
}
function niceErr(e) {
  const m = String((e && e.message) || e || '');
  if (/already registered|already been registered|Database error/i.test(m)) return 'That username is taken';
  if (/Invalid login/i.test(m)) return 'Wrong username or password';
  if (/confirm/i.test(m)) return 'E-mail confirmation is ON in Supabase: turn it off (see SETUP-ONLINE.md)';
  if (/rate|too many/i.test(m)) return 'Too many tries, wait a minute';
  if (/fetch|network|Failed/i.test(m)) return 'No internet connection?';
  return m || 'Something went wrong';
}
async function signUp(u, p) {
  u = u.trim();
  if (!USER_RE.test(u)) return 'Username: 3-16 letters, numbers or _';
  if (badName(u)) return 'Please pick another username';
  if (p.length < 6) return 'Password: at least 6 characters';
  await netInit(); if (!NET.sb) return NET.err || 'Online is not set up yet';
  try {
    const { data, error } = await NET.sb.auth.signUp({ email: fakeEmail(u), password: p, options: { data: { username: u } } });
    if (error) return niceErr(error);
    if (!data.session) return niceErr('confirm');
    await afterLogin(data.user); return 'ok';
  } catch (e) { return niceErr(e); }
}
async function signIn(u, p) {
  u = u.trim();
  if (!u || !p) return 'Type your username and password';
  await netInit(); if (!NET.sb) return NET.err || 'Online is not set up yet';
  try {
    const { data, error } = await NET.sb.auth.signInWithPassword({ email: fakeEmail(u), password: p });
    if (error) return niceErr(error);
    await afterLogin(data.user); return 'ok';
  } catch (e) { return niceErr(e); }
}
async function signOut() { if (G.scene === 'play') save(); await uploadSave(); try { if (NET.sb) await NET.sb.auth.signOut(); } catch (e) {} NET.user = null; NET.name = null; NET.me = {}; toast('Logged out', '#9aa0aa'); }
async function afterLogin(user) {
  NET.user = user; NET.name = (user.user_metadata && user.user_metadata.username) || 'Player';
  try { const { data } = await NET.sb.from('profiles').select('username').eq('id', user.id).maybeSingle(); if (data && data.username) NET.name = data.username; } catch (e) {}
  NET.board = {}; NET.lastPush = 0;
  await syncSave(user);
  pushScore(true);
}
// ---------------- CLOUD SAVE ----------------
// How far along is a save? (rebirths matter most, then best Creditz, then the pass, then playtime)
function progressOf(sv) {
  if (!sv || typeof sv !== 'object') return -1;
  return (sv.rebirths | 0) * 1e6 + Math.log10(Math.max(0, +sv.high || 0) + 1) * 1e4 + ((sv.pass && sv.pass.lvl) | 0) * 100 + Math.min(99, ((sv.stats && +sv.stats.time) || 0) / 3600);
}
// keep up to 5 copies of saves we replaced, just in case (localStorage key "justmine.backups")
function backupSave(sv, why) {
  try { const B = JSON.parse(localStorage.getItem('justmine.backups') || '[]'); B.unshift({ at: Date.now(), why, save: sv }); localStorage.setItem('justmine.backups', JSON.stringify(B.slice(0, 5))); } catch (e) {}
}
async function uploadSave() {
  if (!NET.user || !NET.sb) return;
  try { const raw = localStorage.getItem(SAVE_KEY); if (!raw) return; const sv = JSON.parse(raw); if (sv.owner && sv.owner !== NET.user.id) return; await NET.sb.from('saves').upsert({ id: NET.user.id, data: sv, updated_at: new Date().toISOString() }); } catch (e) {}
}
function reloadGame() {   // the save in localStorage changed under us: load it into the running game
  if (G.scene === 'play') { loadSave(); G.dbombs = []; G.dproj = []; G.rings = []; DRT.clear(); G.bombs = []; G.drills = []; G.menu = null; G.away = null; loadBiome(G.biome, true); }
  else loadSave();
}
// Right after you log in or make an account. The rule: NEVER lose progress.
async function syncSave(user) {
  let cloud = null;
  try { const { data, error } = await NET.sb.from('saves').select('data').eq('id', user.id).maybeSingle(); if (error) return; cloud = data && data.data; }
  catch (e) { return; }   // no internet: don't touch anything
  if (G.scene === 'play') save();   // make sure the newest local progress is in localStorage first
  let local = null; try { local = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  const mine = !!local && (!local.owner || local.owner === user.id);   // no owner = played before accounts existed: it's yours now
  if (local && !mine) backupSave(local, 'another player on this device');
  if (mine && (!cloud || progressOf(local) >= progressOf(cloud))) {
    if (cloud) backupSave(cloud, 'older cloud save');
    local.owner = user.id; G.owner = user.id;
    localStorage.setItem(SAVE_KEY, JSON.stringify(local));
    await uploadSave();
    toast(cloud ? 'Your progress is saved to your account' : 'Your progress is now saved to your account!', '#7dff7a');
  } else if (cloud) {
    if (mine) backupSave(local, 'smaller local save');
    cloud.owner = user.id; localStorage.setItem(SAVE_KEY, JSON.stringify(cloud)); G.owner = user.id;
    reloadGame(); toast('Loaded your account\'s progress', '#7dff7a');
  } else {   // a brand-new account on a computer where SOMEONE ELSE played: start fresh (their save is in their account + a backup)
    freshState(); G.owner = user.id; if (G.scene === 'play') { G.menu = null; loadBiome(0, true); } save(); await uploadSave();
  }
}
// send your scores (at most once a minute). The database only ever keeps the HIGHER number.
async function pushScore(force) {
  if (!NET.user || !NET.sb || G.scene !== 'play' && !force) return;
  const now = Date.now(); if (!force && now - NET.lastPush < 60000) return;
  NET.lastPush = now;
  if (G.owner && G.owner !== NET.user.id) return;   // not your save: don't put its scores on your name
  try { await NET.sb.from('profiles').update({ best: G.high, rebirths: rebirthsDone(), pass_lvl: G.pass ? G.pass.lvl : 0 }).eq('id', NET.user.id); } catch (e) {}
  uploadSave();
}
async function fetchBoard(col) {
  if (!NET.sb || NET.busy[col]) return;
  NET.busy[col] = true;
  try {
    const { data, error } = await NET.sb.from('profiles').select('id,username,best,rebirths,pass_lvl').order(col, { ascending: false }).order('updated_at', { ascending: true }).limit(50);
    if (error) throw error;
    NET.board[col] = data || []; NET.boardT[col] = Date.now(); NET.err = '';
    if (NET.user) {   // your own place, even if you're not in the top 50
      const mine = (data || []).findIndex(r => r.id === NET.user.id);
      if (mine >= 0) NET.me[col] = mine + 1;
      else { const v = col === 'best' ? G.high : col === 'rebirths' ? rebirthsDone() : G.pass.lvl; const { count } = await NET.sb.from('profiles').select('id', { count: 'exact', head: true }).gt(col, v); NET.me[col] = (count || 0) + 1; }
    }
  } catch (e) { NET.err = niceErr(e); }
  NET.busy[col] = false;
}

// ====================================================================
//  INPUT
// ====================================================================
function setMouse(e) { G.mouse.x = e.clientX; G.mouse.y = e.clientY; G.mouse.over = true; }
function hitRegion(x, y) { for (let i = UI.regions.length - 1; i >= 0; i--) { const r = UI.regions[i]; if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r; } return null; }
// TOUCH: a finger has no "hover", so buttons fire when you LIFT your finger (and only if it didn't slide),

const PTR = { id: null, sx: 0, sy: 0, moved: false, region: null, px: 0, py: 0, touch: false, scroll: null, st: 0, vel: 0, lx: 0, ly: 0 };

    if (DDRAG.on) { PTR.moved = true; return; }
  }
  if (PTR.id === e.pointerId) {
    const dx = e.clientX - PTR.sx, dy = e.clientY - PTR.sy;
    if (!PTR.moved && Math.hypot(dx, dy) > 10) PTR.moved = true;

      sa.drag = true; const d = sa.axis === 'x' ? dx : dy, step = sa.axis === 'x' ? e.clientX - PTR.lx : e.clientY - PTR.ly;
      sa.target = sa.pos = clamp(PTR.st - d / sa.k, -50, sa.max + 50); PTR.vel = -step / sa.k;
    } else if (PTR.moved && G.menu && PTR.region) { PAN.x = PTR.px + dx; PAN.y = PTR.py + dy; }
    PTR.lx = e.clientX; PTR.ly = e.clientY;
  }
});
cv.addEventListener('pointerdown', e => {
