  if (G.victory > 0 && G.victory < 1) G.victory = Math.min(1, G.victory + DT * 1.5);
  G.mouse.swing *= 0.8;
  if (G.bombPop > 0) G.bombPop = Math.max(0, G.bombPop - DT * 3);

  if (G.scene === 'play') {
    G.stats.time += DT;
    if (G.boostT > 0) G.boostT = Math.max(0, G.boostT - DT);
    if (G.gen && G.gen.length) { const s = G.gen.shift(); if (s) spawnRock(s.c, s.r); if (!G.gen.length) G.gen = null; }
    if (G.loading > 0) G.loading--;
    // quests: keep 3, replace finished ones after a short "done!" moment
    for (const q of G.quests) if (q.done > 0) { q.done -= DT; if (q.done <= 0) q.gone = true; }
    G.quests = G.quests.filter(q => !q.gone);
    while (G.quests.length < 3) G.quests.push(newQuest());
    // RegenRocks: all (normal) rocks gone -> short wait -> new grid. Reinforced leftovers crumble.
    if (!G.gen && G.regenWait < 0 && aliveRocks() < 1) G.regenWait = Math.min(2, spawnLock());
    if (G.regenWait >= 0) {
      G.regenWait -= DT;
      if (G.regenWait < 0) {
        for (const r of G.rocks) if (r.state === 'rock' && r.hard) dust(r.x, r.y, r.col, 4);
        G.rocks = G.rocks.filter(r => r.state === 'gem');
        for (const r of G.rocks) r.gemT = Math.max(r.gemT, 2);   // minerals still showing fly away before the new rocks arrive
        makeGrid(); AUDIO.sfx('regen');
      }
    }

    // events: a meteor shower or a gold rush every few minutes
    if (G.shower > 0) {
      G.shower = Math.max(0, G.shower - DT);
      if ((G.meteorT -= DT) <= 0) { spawnMeteor(); G.meteorT = (0.5 + Math.random() * 0.7) / (1 + upv('meteor', 0)); }
    } else if (G.rush > 0) {
      G.rush = Math.max(0, G.rush - DT);
      if (G.rush === 0) ach('rush');
    } else if ((G.nextEvent -= DT * (perk(5) ? 1.5 : 1) * (1 + upv('meteor', 0))) <= 0) {
      G.nextEvent = 180 + Math.random() * 150;
      if (Math.random() < 0.55) startShower(); else startRush();
    }
    for (const m of G.meteors) { m.t += DT; if (m.t >= m.dur && !m.done) { m.done = true; meteorImpact(m); } }
    G.meteors = G.meteors.filter(m => !m.done);

    // Lightning rod: in Storm Peaks, a bolt breaks a random rock now and then
    if (G.stormLevel > 0 && BIOMES[G.biome].name === 'Storm Peaks' && (G.rodT = (G.rodT || 0) + DT) >= SHOPV.storm[G.stormLevel - 1]) {
      G.rodT = 0;
      const free = G.rocks.filter(r => r.state === 'rock' && r.spawnT <= 0 && !r.hard);
      if (free.length) { const r = free[Math.floor(Math.random() * free.length)]; G.bolt = { t: 0, pts: boltPts() }; G.flash = Math.max(G.flash, 0.4); G.flashCol = '#dfe8ff'; AUDIO.sfx('thunder'); r.costume = 4; breakRock(r, 'meteor'); }
    }
    // remember how fast Creditz come in (for offline mining)
    if ((G.rateT = (G.rateT || 0) + DT) >= 5) { const r = (G.earned || 0) / G.rateT; G.rate = G.rate ? G.rate * 0.85 + r * 0.15 : r; G.earned = 0; G.rateT = 0; }
    // bombs
    if (G.bombCD > 0) { G.bombCD -= DT; if (G.bombCD <= 0) { G.bombCD = 0; G.bombPop = 1; } }
    if (G.keys.Space && !G.menu) { const w = toWorld(G.mouse.x, G.mouse.y); dropBomb(w.x, w.y); }
    for (const bo of G.bombs) { bo.t += DT; if (bo.t < 0) continue; bo.size += bo.speed; bo.speed -= 5; bo.ghost = Math.max(0, bo.ghost) + 5; }

    // auto miners (they skip reinforced rocks)
    while (G.drills.length < drillCount()) G.drills.push({ target: null, wait: 0.15 * G.drills.length, x: 0, y: 200, spin: Math.random() * 6, hitT: 0 });
    if (G.drills.length > drillCount()) G.drills.length = drillCount();
    for (const d of G.drills) {
      if (d.target && d.target !== G.heart && (d.target.state !== 'rock' || G.rocks.indexOf(d.target) < 0)) d.target = null;
      if (d.target === G.heart && !G.heart) d.target = null;
      if (!d.target && (d.wait -= DT) <= 0) {
        const free = G.rocks.filter(r => r.state === 'rock' && !r.hard && r.spawnT <= 0 && !G.drills.some(o => o.target === r));
        if (free.length) d.target = free[Math.floor(Math.random() * free.length)];
        else if (G.heart) d.target = G.heart;
        d.wait = 0.4;
      }
      const tx = d.target ? (d.target === G.heart ? (d.spin % 2 - 1) * 50 : d.target.x) + 16 : d.x, ty = d.target ? (d.target === G.heart ? 32 : d.target.y) + 26 : d.y;
      d.x += (tx - d.x) * 0.18; d.y += (ty - d.y) * 0.18;
      if (d.hitT > 0) d.hitT -= DT;
    }

    // who is hitting what?
    const hover = worldHover();
    if (G.clankT > 0) G.clankT -= DT;
    for (const rock of G.rocks) {
      if (rock.shake > 0) rock.shake--;
      if (rock.flash > 0) rock.flash = Math.max(0, rock.flash - 0.2);
      if (rock.ringT > 0) rock.ringT = Math.max(0, rock.ringT - DT);
      if (rock.state === 'gem') { rock.gemT += DT; if (rock.gemT >= 2.6) rock.state = 'dead'; continue; }
      if (rock.state !== 'rock') continue;
      if (rock.spawnT > 0) { rock.spawnT -= DT; if (rock.spawnT <= 0) { rock.spawnT = 0; if (rock.spawnMax > 0.6) rock.ringT = 0.3; } continue; }
      if (rock.cool > 0) { rock.cool -= DT; if (rock.cool <= 0) { rock.cool = 0; if (rock.coolMax > 0.6) rock.ringT = 0.3; } continue; }
      let by = null;
      const bomb = G.bombs.find(bo => bo.t >= 0 && bombTouches(bo, rock));
      if (bomb) { by = 'bomb'; bomb.hits.add(rock); if (bomb.hits.size >= 15) ach('kaboom'); }
      else if (hover === rock && G.mouse.down) {
        if (rock.hard) {   // clank! pickaxes bounce off
          rock.cool = 0.35; rock.coolMax = 0; rock.shake = 3;
          for (let i = 0; i < 4; i++) G.parts.push({ kind: 'spark', x: rock.x, y: rock.y, vx: (Math.random() - 0.5) * 6, vy: Math.random() * 4, life: 10, max: 10, col: '#ffffff', s: 1.5 });
          AUDIO.sfx('clank'); G.mouse.swing = 1;
          if (G.clankT <= 0) { toast('Reinforced! Only bombs and meteors crack it', '#c9d2d9'); G.clankT = 6; }
        } else by = 'mouse';
      }
      else if (!rock.hard) { const d = G.drills.find(d => d.target === rock); if (d) { by = 'auto'; d.hitT = 0.15; } }
      if (by) hitRock(rock, by);
    }
    G.rocks = G.rocks.filter(r => r.state !== 'dead');
    // the Heart of the Mountain
    if (G.heart) {
      const h = G.heart;
      if (h.shake > 0) h.shake--; if (h.flash > 0) h.flash = Math.max(0, h.flash - 0.15);
      for (const bo of G.bombs) if (bo.t >= 0 && !bo.heartHit && bombRadius(bo) > Math.hypot(bo.x, bo.y - 32) - 72) { bo.heartHit = true; hitHeart(8 * G.bombLevel); if (!G.heart) break; }
      if (G.heart && (h.cool -= DT) <= 0) {
        if (hover === h && G.mouse.down) { hitHeart(1); h.cool = Math.max(0.12, miningSpeed() * 0.5); G.mouse.swing = 1; }
        else { const d = G.drills.find(d => d.target === h); if (d) { hitHeart(1); h.cool = 0.6; d.hitT = 0.15; } }
      }
    }
    for (const bo of G.bombs) if (bo.speed < 0 && bombTier(bo.level).name === 'black') {   // the implosion's final pop
      G.lights.push({ x: bo.x, y: bo.y, r: 90, col: '#e0c8ff', life: 0.35, max: 0.35 }); sparkle(bo.x, bo.y, '#e0c8ff', 16); G.shake = Math.max(G.shake, 8);
    }
    G.bombs = G.bombs.filter(bo => bo.speed >= 0);
    if ((G.saveT += DT) > 3) { G.saveT = 0; save(); checkAch(); }
  }

  // effects
  for (const p of G.parts) {
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.kind === 'chunk' && G.bombs.length) for (const bo of G.bombs) if (bo.t >= 0 && bombTier(bo.level).name === 'black') { p.vx += (bo.x - p.x) * 0.02; p.vy += (bo.y - p.y) * 0.02; }
    if (p.kind === 'chunk') { p.vy -= 0.45; p.rot += p.vr; if (p.y < -105 && p.vy < 0 && !p.bounced) { p.vy *= -0.35; p.vx *= 0.6; p.bounced = true; } }
    else if (p.kind === 'spark') { p.vx *= 0.92; p.vy = p.vy * 0.92 - 0.12; }
    else if (p.kind === 'dust' || p.kind === 'smoke') { p.vx *= 0.93; p.vy = p.vy * 0.93 + (p.kind === 'smoke' ? 0.05 : 0.01); p.s += p.grow || 0.4; }
    else if (p.kind === 'star') { p.vx *= 0.94; p.vy = p.vy * 0.94 - 0.03; }
    else if (p.kind === 'coin') { p.vy -= 0.4; p.rot += 0.3; if (p.y < -105 && p.vy < 0 && !p.bounced) { p.vy *= -0.4; p.bounced = true; } }
    else if (p.kind === 'suck') { p.x += (p.tx - p.x) * 0.16; p.y += (p.ty - p.y) * 0.16; }
  }
  G.parts = G.parts.filter(p => p.life > 0);
  if (G.parts.length > 700) G.parts.splice(0, G.parts.length - 700);
  for (const l of G.lights) l.life -= DT;
  G.lights = G.lights.filter(l => l.life > 0);
  if (G.lights.length > 60) G.lights.splice(0, G.lights.length - 60);
  for (const f of G.floats) { f.t += DT; f.y += 0.9; }
  G.floats = G.floats.filter(f => f.t < 1.5);
  if (G.floats.length > 40) G.floats.splice(0, G.floats.length - 40);
  for (const t of G.toasts) t.t += DT;
  G.toasts = G.toasts.filter(t => t.t < 2.6);
  G.achPop.slice(0, 2).forEach(a => { a.t += DT; });   // only the two on screen count down; the rest wait their turn
  G.achPop = G.achPop.filter(a => a.t < 4);
  if (G.confirmNew > 0) G.confirmNew -= DT;
  tickAmbient();
  if (G.creditz > G.high) G.high = G.creditz;
}
// ---------------- particles ----------------

      s: small ? rnd(2, 4) : rnd(4, 9), col: Math.random() < 0.5 ? col : darken(col, 0.25), life: 30 + rnd(0, 25), max: 55, pts: [Math.random(), Math.random(), Math.random()] });
  }
}
function dust(x, y, col, n) {

function toast(text, col) {
  const last = G.toasts[G.toasts.length - 1];
  if (last && last.text === text) { last.t = Math.min(last.t, 0.3); return; }
  G.toasts.push({ text, t: 0, col: col || '#ffffff' });
  if (G.toasts.length > 3) G.toasts.shift();
}

// ---------------- ambient effects per biome (screen space, 0..1 coordinates) ----------------
function tickAmbient() {
  const type = G.scene === 'title' ? 'dust' : BIOMES[G.biome].amb;
  const A = G.amb, R = Math.random;
  const want = { dust: 40, sparks: 26, heavy: 45, shimmer: 50, embers: 55, snow: 110, bubbles: 40, void: 70, sand: 70, jungle: 34, storm: 120, lava: 50 }[type];
  while (A.length < want) {
    const p = { x: R(), y: R(), t: 0, life: 4 + R() * 6, s: R(), ph: R() * 6.28, type };
    if (type === 'embers' || type === 'bubbles' || type === 'lava') p.y = 1 + R() * 0.2;
    if (type === 'snow' || type === 'heavy' || type === 'storm') p.y = -R() * 0.2;
    if (type === 'sand') p.x = -R() * 0.2;
    A.push(p);
  }
  for (const p of A) {
    p.t += DT;
    if (p.type === 'dust') { p.x += Math.sin(G.time * 0.3 + p.ph) * 0.0004; p.y += 0.0002; }
    else if (p.type === 'heavy') { p.y += 0.0012 + p.s * 0.001; p.x += Math.sin(G.time + p.ph) * 0.0006; }
    else if (p.type === 'embers' || p.type === 'lava') { p.y -= 0.002 + p.s * 0.002; p.x += Math.sin(G.time * 2 + p.ph) * 0.001; }
    else if (p.type === 'snow') { p.y += 0.0015 + p.s * 0.0025; p.x += Math.sin(G.time * 1.3 + p.ph) * 0.0012 + 0.0004; }
    else if (p.type === 'bubbles') { p.y -= 0.0012 + p.s * 0.0012; p.x += Math.sin(G.time * 3 + p.ph) * 0.0006; }
    else if (p.type === 'void') { const dx = 0.5 - p.x, dy = 0.5 - p.y, d = Math.hypot(dx, dy) + 0.01; p.x += dx / d * 0.0012 - dy / d * 0.0018; p.y += dy / d * 0.0012 + dx / d * 0.0018; if (d < 0.03) p.t = 99; }
    else if (p.type === 'sparks') { p.x += Math.cos(p.ph) * 0.004; p.y += Math.sin(p.ph) * 0.004; if (R() < 0.05) p.ph += (R() - 0.5) * 2; }
    else if (p.type === 'sand') { const gust = 1 + Math.max(0, Math.sin(G.time * 0.7)) * 2; p.x += (0.003 + p.s * 0.004) * gust; p.y += Math.sin(G.time * 2 + p.ph) * 0.0008; }
    else if (p.type === 'jungle') { if (p.s > 0.4) { p.x += Math.cos(G.time * 0.8 + p.ph) * 0.0009; p.y += Math.sin(G.time * 1.1 + p.ph) * 0.0009; } else { p.y += 0.0012; p.x += Math.sin(G.time * 2 + p.ph) * 0.0012; } }
    else if (p.type === 'storm') { p.y += 0.02 + p.s * 0.01; p.x -= 0.004; }
  }
  G.amb = A.filter(p => p.t < p.life && p.y < 1.25 && p.y > -0.25 && p.x > -0.25 && p.x < 1.1 && p.type === type);
  if (type === 'sparks' && R() < 0.012) G.arc = { t: 0, pts: arcPts() };
  if (G.arc) { G.arc.t += DT; if (G.arc.t > 0.25) G.arc = null; }
  // Storm Peaks: lightning
  if (type === 'storm' && G.scene === 'play' && R() < 0.006) { G.bolt = { t: 0, pts: boltPts() }; G.flash = Math.max(G.flash, 0.5); G.flashCol = '#dfe8ff'; AUDIO.sfx('thunder'); }
  if (G.bolt) { G.bolt.t += DT; if (G.bolt.t > 0.35) G.bolt = null; }
}
function boltPts() {
  const pts = []; let x = 0.15 + Math.random() * 0.7, y = 0;
  while (y < 0.75) { pts.push([x, y]); x += (Math.random() - 0.5) * 0.08; y += 0.04 + Math.random() * 0.05; }
  return pts;
}
function arcPts() {
  const pts = [], x0 = Math.random(), y0 = Math.random() * 0.3, x1 = x0 + (Math.random() - 0.5) * 0.4, y1 = y0 + 0.2 + Math.random() * 0.3;
  for (let i = 0; i <= 10; i++) pts.push([x0 + (x1 - x0) * i / 10 + (Math.random() - 0.5) * 0.03, y0 + (y1 - y0) * i / 10 + (Math.random() - 0.5) * 0.03]);
  return pts;
}

// ---------------- shop / menus / rebirth ----------------
function buy(kind) {
  const u = SHOP[kind], key = LVL_KEY[kind], lvl = G[key];
  if (lvl >= u.costs.length && !u.endless) return;
  if (kind === 'reborn' && G.rebirthMult <= 1) { toast('Rebirth power needs at least one rebirth'); AUDIO.sfx('deny'); return; }
  const cost = costOf(kind, lvl);
  if (G.creditz < cost) { toast('You need ' + fmt(cost) + ' Creditz'); AUDIO.sfx('deny'); return; }
  G.creditz -= cost; G[key] = lvl + 1;
  AUDIO.sfx('buy');
  G.hudPulse = 1;
  checkAch(); save();
}
function teleport(i) {
  if (!canLoad() || i < 0 || i >= BIOMES.length) return;
  const paid = isUnlocked(i);
  if (!paid && !canVisit(i)) { toast('Visit ' + BIOMES[i - 1].name + ' first'); AUDIO.sfx('deny'); return; }
  if (!paid && G.creditz < BIOMES[i].req) { toast('Unlocking ' + BIOMES[i].name + ' costs ' + fmt(BIOMES[i].req) + ' Creditz'); AUDIO.sfx('deny'); return; }
  if (!paid) { G.creditz -= BIOMES[i].req; G.shown = G.creditz; toast('Unlocked ' + BIOMES[i].name + '!', BIOMES[i].accent); }   // pay once, travel free after
  loadBiome(i, true);
  AUDIO.sfx('teleport');
  checkAch(); save();
}
const isUnlocked = i => !!(G.reached & (1 << i));                     // paid for this rebirth
const canVisit = i => i === 0 || !!(G.reached & (1 << (i - 1)));   // biomes unlock in order
function resetRun() {   // everything a rebirth takes away
  G.creditz = 0; G.shown = 0;
  Object.assign(G, LEVEL_DEFAULTS);
  G.cmLevel = perk(6) ? 1 : 0;
  G.spLevel = perk(10) ? 2 : perk(2) ? 1 : 0;
  G.bombs = []; G.bombCD = 0; G.meteors = []; G.shower = 0; G.rush = 0;
  G.drills = []; G.mouse.down = false; G.keys.Space = false;
  const keep = perk(6) ? 6 : perk(3) ? 3 : 1;   // visited biomes reset too (perks keep the first few)
  G.reached = (1 << keep) - 1;
}
function tryRebirth() {
  if (!canLoad()) return;
  if (G.creditz < rebirthCost()) { toast('You need ' + fmt(rebirthCost()) + ' Creditz to Rebirth'); AUDIO.sfx('deny'); return; }
  G.rebirthMult *= 2;               // his "change RebirthMultiplier by RebirthMultiplier"
  G.rebirths++;
  resetRun();
  const unlocked = PERKS.find(p => p[0] === rebirthsDone());
  loadBiome(0, true);
  G.tpName = 'REBIRTH ' + rebirthsDone();
  toast('Every mineral is now worth x' + fmt(G.rebirthMult) + '!', '#ffd84a');
  if (unlocked) toast('New perk: ' + unlocked[1], '#7dff7a');
  if (rebirthsDone() === HEART_REBIRTHS && !G.won) toast('Something woke up deep in Void Valley...', '#b678ff');
  G.flash = 1; G.flashCol = '#fff2c0';
  AUDIO.sfx('rebirth');
  checkAch(); save();
}
function openMenu(m) {
  if (m && (!canLoad() || G.victory)) return;
  G.menu = G.menu === m ? null : m;
  G.mouse.down = false;
  if (G.menu) { G.menuT[G.menu] = G.menuT[G.menu] || 0; AUDIO.sfx('open'); }
}
function startGame(fresh) {
  if (fresh) {
    wipeSave();
    Object.assign(G, LEVEL_DEFAULTS, { creditz: 0, shown: 0, high: 0, rebirths: 1, rebirthMult: 1, biome: 0, found: {}, ach: {}, visited: 1, reached: 1, pick: 0, quests: [], questsDone: 0, boostT: 0,
      stats: { rocks: 0, empty: 0, minerals: 0, time: 0, bombs: 0, hard: 0 }, heartHP: HEART_HP, won: false, crystalHue: 0 });
  } else loadSave();
  G.scene = 'play'; G.victory = 0; G.menu = null;
  if (fresh) G.away = null;
  G.bombs = []; G.drills = []; G.bombCD = 0; G.shower = 0; G.rush = 0; G.nextEvent = 150 + Math.random() * 90;
  loadBiome(G.biome, true);
  AUDIO.sfx('teleport');
  save();
}

      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, R * 1.6, 0, 6.283); ctx.fill();

}

// ---------------- overlays: teleport, flash, victory ----------------
function renderOverlays() {
  setScreen();

  if (G.flash > 0) { ctx.fillStyle = rgba(G.flashCol, Math.min(0.6, G.flash * 0.6)); ctx.fillRect(0, 0, W, H); }

      ctx.fillStyle = '#040408'; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(W / 2, H / 2, Math.max(1, r), 0, 6.283, true); ctx.fill('evenodd');
      ctx.lineWidth = 6; ctx.strokeStyle = rgba(b.accent, 1 - t); ctx.beginPath(); ctx.arc(W / 2, H / 2, Math.max(1, r), 0, 6.283); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      const R = seeded(77);
      for (let k = 0; k < 40; k++) { const a = R() * 6.283, d0 = r * (0.3 + R() * 0.7), len = 40 + R() * 120; ctx.strokeStyle = rgba(b.accent, (1 - t) * 0.6); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * d0, H / 2 + Math.sin(a) * d0); ctx.lineTo(W / 2 + Math.cos(a) * (d0 + len), H / 2 + Math.sin(a) * (d0 + len)); ctx.stroke(); }
      ctx.globalCompositeOperation = 'source-over';
    }
    const ta = clamp(Math.min((t - 0.15) * 4, (2.2 - t) * 2), 0, 1);
    if (ta > 0) {
      ctx.globalAlpha = ta; const sc = 0.8 + 0.2 * easeBack(clamp((t - 0.15) * 3, 0, 1));
      ctx.save(); ctx.translate(W / 2, H / 2 - 20); ctx.scale(sc, sc);
      txt(G.tpName, 0, 0, fitSize(G.tpName, 56, W - 40), '#ffffff', { stroke: 7 });
      ctx.fillStyle = b.accent; ctx.fillRect(-120, 34, 240, 3);
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }
  if (G.victory > 0) {
    const t = G.victory;
    ctx.fillStyle = 'rgba(4,4,8,' + 0.75 * t + ')'; ctx.fillRect(0, 0, W, H);
    uiFrame(W / 2 - 260 * Math.min(1, W / 560), H / 2 - 190, Math.min(1, W / 560));
    ctx.globalAlpha = t;

    txt('You broke the Heart of the Mountain!', 260, 164, 15, '#ffffff', { font: FB, weight: 800 });
    const st = G.stats, mins = Math.floor(st.time / 60);
    const lines = ['Time mined: ' + Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm', 'Rocks broken: ' + fmt(st.rocks) + '   Minerals: ' + fmt(st.minerals), 'Rebirths: ' + rebirthsDone() + '   Best: ' + fmt(G.high) + ' Creditz', 'Trophies: ' + ACH.filter(a => G.ach[a[0]]).length + ' / ' + ACH.length];
    lines.forEach((l, i) => txt(l, 260, 200 + i * 22, 14, '#c9cfdc', { font: FB, weight: 800 }));
    btn('keepmining', 160, 300, 200, 50, 'Keep mining', { col: '#3aa04a', size: 22, fn: () => { G.victory = 0; AUDIO.sfx('click'); } });
    ctx.globalAlpha = 1;
  }
}

  if (G.high > 0) txt('BEST  ' + fmt(G.high) + ' Creditz', W / 2, H - 76, 15, '#ffd84a', { font: FB, weight: 900 });
  txt('a game by Sixten', W - 16, H - 20, 13, '#8a90a0', { align: 'right', font: FB, weight: 800 });

// ====================================================================
//  INPUT
// ====================================================================
function setMouse(e) { G.mouse.x = e.clientX; G.mouse.y = e.clientY; G.mouse.over = true; }
function hitRegion(x, y) { for (let i = UI.regions.length - 1; i >= 0; i--) { const r = UI.regions[i]; if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r; } return null; }
cv.addEventListener('pointermove', e => setMouse(e));
cv.addEventListener('pointerdown', e => {
  setMouse(e);
  AUDIO.init();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const r = hitRegion(G.mouse.x, G.mouse.y);
  if (r) { if (r.fn) r.fn(); G.mouse.down = !!(e.button === 0 && !r.fn && r.id === 'none'); G.mouse.onUI = true; if (e.button === 0) G.mouse.down = false; return; }
  if (G.scene !== 'play') return;
  if (e.button === 2) { const w = toWorld(G.mouse.x, G.mouse.y); dropBomb(w.x, w.y); return; }
  G.mouse.down = true;
});
window.addEventListener('pointerup', () => { G.mouse.down = false; });
cv.addEventListener('pointerleave', () => { G.mouse.over = false; G.mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  AUDIO.init();
  if (e.code === 'Space') { G.keys.Space = true; e.preventDefault(); }
  if (e.code === 'Escape') { G.menu = null; if (G.victory) G.victory = 0; }
  if (e.code === 'KeyM') { G.settings.vol = G.settings.vol === 3 ? 0 : 3; AUDIO.applyVolume(); save(); }
  if (G.scene === 'play' && !e.repeat) {
    const m = { KeyB: 'biomes', KeyS: 'shop', KeyR: 'rebirth', KeyK: 'book' }[e.code];
    if (m) { AUDIO.sfx('click'); openMenu(m); }
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') G.keys.Space = false; });
window.addEventListener('blur', () => { G.keys.Space = false; G.mouse.down = false; });
window.addEventListener('resize', resize);
window.addEventListener('beforeunload', () => { if (G.scene === 'play') save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.scene === 'play') save(); });

// ====================================================================
//  START + MAIN LOOP (fixed 30 game frames a second, drawing every screen frame)
// ====================================================================
resize();
function ready() { loadSave(); G.scene = 'title'; AUDIO.setSong(0); }
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('40px "Lilita One"'), document.fonts.load('900 16px "Nunito"')]).catch(() => {}).then(() => { bgKey = ''; ready(); });
  setTimeout(() => { if (G.scene === 'loading') ready(); }, 2500);   // offline? use fallback fonts
} else ready();
let last = 0, acc = 0;
function frame(t) {
  if (!last) last = t;
  acc += Math.min(0.25, (t - last) / 1000); last = t;
  while (acc >= DT) { tick(); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__JM = { setHeart: n => { HEART_REBIRTHS = n; }, isUnlocked, TUNE, RX, ROCK_MAX, HEART: HEART_REBIRTHS, REBIRTH_COSTS, costOf, canVisit, SHOPV, SHOP_ORDER, LVL_KEY, PICKS, fmt, quest, startRush, bombTier, pickTier, G, tick, render, BIOMES, SHOP, ART, UI, startGame, buy, teleport, tryRebirth, loadBiome, openMenu, dropBomb, miningSpeed, rebirthCost, canLoad, creditzMult, totalMult, perk, toScreen, toWorld, hitRegion, checkAch, startShower, resize };
